name: Build libmpv-android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      arches:
        description: '要构建的架构（空格分隔：armv7l arm64 x86 x86_64）'
        required: false
        default: 'armv7l arm64 x86 x86_64'
        type: string
      release:
        description: '构建完成后创建 Release 并发布 .so（勾选即发布）'
        required: false
        default: false
        type: boolean
      releaseTag:
        description: 'Release tag（留空 = build-<日期>-<短提交>）'
        required: false
        type: string

permissions:
  contents: write

env:
  NDK_VER: 27.1.12297006

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      # DsPlayer 定制：逐架构构建 libmpv.so（含 libxml2/DASH），跳过 helper/event_loop
      # 的 Flutter 段（节省一半以上时间）。架构名用 build.sh 的口径
      # （armv7l/arm64/x86/x86_64），产物按 Android ABI 名命名
      # （armeabi-v7a/arm64-v8a/x86/x86_64），可直接落 plugin_mpv 的 jniLibs/<abi>/。
      # 需要完整 jar 时改回 bundle_default.sh 调用。
      - name: Build libmpv (libxml2/DASH)
        working-directory: ./buildscripts
        env:
          # 经 env 传入而非直接插值进脚本：输入值不参与 shell 解析
          ARCHES_INPUT: ${{ github.event.inputs.arches }}
        run: |
          set -e
          ARCHES="$ARCHES_INPUT"
          [ -n "$ARCHES" ] || ARCHES="armv7l arm64 x86 x86_64"
          echo "构建架构：$ARCHES"
          ./download.sh
          ./patch.sh
          cp flavors/default.sh scripts/ffmpeg.sh
          grep -n "libxml2" scripts/ffmpeg.sh
          abi_of() {
            case "$1" in
              armv7l) echo armeabi-v7a ;;
              arm64)  echo arm64-v8a ;;
              x86)    echo x86 ;;
              x86_64) echo x86_64 ;;
              *) echo "未知架构: $1" >&2; return 1 ;;
            esac
          }
          mkdir -p ../output-mpv
          for arch in $ARCHES; do
            abi=$(abi_of "$arch")
            echo "===== 架构: $arch（ABI $abi）====="
            rm -rf "prefix/$abi"
            if ! ./build.sh --arch $arch mpv; then
              echo "===== 构建失败，dump 诊断 ====="
              echo "--- libxml-2.0.pc 内容 ---"
              cat "prefix/$abi/lib/pkgconfig/libxml-2.0.pc" 2>/dev/null || true
              echo "--- pkg-config 完整输出（含 sysroot 前置）---"
              PKG_CONFIG_SYSROOT_DIR="$PWD/prefix/$abi" PKG_CONFIG_LIBDIR="$PWD/prefix/$abi/lib/pkgconfig" \
                sh -c 'pkg-config --cflags libxml-2.0; pkg-config --libs --static libxml-2.0; echo "--- exists:"; pkg-config --exists libxml-2.0 && echo OK || echo FAIL' || true
              echo "--- ffmpeg config.log 中的 libxml 段 ---"
              find deps/ffmpeg -name config.log -print 2>/dev/null | while read -r cfg; do
                echo "### $cfg"
                grep -B8 -A30 "libxml" "$cfg" 2>/dev/null | tail -80 || true
              done
              exit 1
            fi
            cp -v "prefix/$abi/lib/libmpv.so" "../output-mpv/libmpv-$abi.so"
          done
          echo "===== 产物校验（架构 + dash demuxer + 动态依赖）====="
          # 工具从 NDK 定位（path.sh 的 toolchain 推导同源：buildscripts/sdk/
          # android-sdk-linux 软链到 ANDROID_HOME）；workflow 的 shell 没有 NDK bin，
          # 不能直接裸调 llvm-nm。
          ( . ./include/depinfo.sh
            echo "$PWD/sdk/android-sdk-linux/ndk/$v_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" \
              > /tmp/toolbin )
          TOOLBIN=$(cat /tmp/toolbin)
          NM="$TOOLBIN/llvm-nm"
          READELF="$TOOLBIN/llvm-readelf"
          [ -x "$NM" ] || { echo "找不到 llvm-nm: $NM"; ls -la "$TOOLBIN" | head; exit 1; }
          [ -x "$READELF" ] || { echo "找不到 llvm-readelf: $READELF"; exit 1; }
          for f in ../output-mpv/libmpv-*.so; do
            echo "--- $f"
            "$READELF" -h "$f" | grep -E 'Machine|Class' | sed 's/^/    /'
            echo "    ff_dash_demuxer: $("$NM" --dynamic --defined-only "$f" | grep -c ff_dash_demuxer)"
            echo "    demuxer 总数: $("$NM" --dynamic --defined-only "$f" | grep -oE 'ff_[a-z0-9_]+_demuxer' | sort -u | wc -l)"
            "$READELF" -d "$f" | grep NEEDED | sed 's/.*\[/    NEEDED /;s/\]//'
          done
          ls -la ../output-mpv/

      - name: Upload libmpv
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-so
          path: ./output-mpv/*.so

      # Release 发布：.so + 校验和 + 构建信息（版本锚点用 buildscripts 的
      # depinfo.sh 读，可复核）。勾选 release 输入才执行。
      - name: Prepare release assets
        if: ${{ github.event.inputs.release == 'true' }}
        run: |
          chmod +x buildscripts/make_release_assets.sh
          ./buildscripts/make_release_assets.sh output-mpv

      - name: Set Tag Name
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          TAG_INPUT: ${{ github.event.inputs.releaseTag }}
        run: |
          TAG="$TAG_INPUT"
          [ -n "$TAG" ] || TAG="build-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v3
        if: ${{ github.event.inputs.release == 'true' }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: ./output-mpv/BUILD-INFO.md
          make_latest: "true"
          files: |
            output-mpv/libmpv-*.so
            output-mpv/SHA256SUMS
            output-mpv/MD5SUMS
