name: Build libmpv-android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft release of the build'
        required: false
        default: false
        type: boolean
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

permissions:
  contents: write

env:
  NDK_VER: 27.1.12297006

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      # DsPlayer 定制：只编 arm64 + x86_64（插件实际使用的 ABI），
      # 并只取 libmpv.so（跳过 helper/event_loop 的 Flutter 段，节省一半以上时间）。
      # 需要完整 jar 时改回 bundle_default.sh 调用。
      - name: Build libmpv (arm64 + x86_64, 含 libxml2/DASH)
        working-directory: ./buildscripts
        run: |
          set -e
          ./download.sh
          ./patch.sh
          cp flavors/default.sh scripts/ffmpeg.sh
          grep -n "libxml2" scripts/ffmpeg.sh
          for arch in arm64 x86_64; do
            echo "===== 架构: $arch ====="
            if ! ./build.sh --arch $arch mpv; then
              echo "===== 构建失败，dump 诊断 ====="
              echo "--- libxml-2.0.pc 内容 ---"
              cat "prefix/$([ $arch = arm64 ] && echo arm64-v8a || echo x86_64)/lib/pkgconfig/libxml-2.0.pc" 2>/dev/null || true
              echo "--- pkg-config 完整输出 ---"
              PKG_CONFIG_SYSROOT_DIR="$PWD/prefix/$([ $arch = arm64 ] && echo arm64-v8a || echo x86_64)"               PKG_CONFIG_LIBDIR="$PWD/prefix/$([ $arch = arm64 ] && echo arm64-v8a || echo x86_64)/lib/pkgconfig"                 sh -c 'pkg-config --cflags libxml-2.0; pkg-config --libs libxml-2.0; echo "--- exists:"; pkg-config --exists libxml-2.0 && echo OK || echo FAIL' || true
              echo "--- ffmpeg config.log 中的 libxml 段 ---"
              grep -B3 -A25 "libxml" deps/ffmpeg/ffbuild/config.log 2>/dev/null | tail -60 || true
              exit 1
            fi
          done
          # 收集产物（prefix/<abi>/lib/libmpv.so）
          mkdir -p ../output-mpv
          for abi in arm64-v8a x86_64; do
            cp -v "prefix/$abi/lib/libmpv.so" "../output-mpv/libmpv-$abi.so"
          done
          ls -la ../output-mpv/

      - name: Upload libmpv
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-dash
          path: ./output-mpv/*.so
      # - name: Bundle (full)
      #   working-directory: ./buildscripts
      #   run: |
      #     sudo chmod +x bundle_full.sh
      #     ./bundle_full.sh
      # - name: Bundle (encoders-gpl)
      #   working-directory: ./buildscripts
      #   run: |
      #     sudo chmod +x bundle_encoders-gpl.sh
      #     ./bundle_encoders-gpl.sh
      - uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: ./output/*.jar

      - name: Set Tag Name
        if: ${{ github.event.inputs.release == 'true' }}
        run: echo "TAG_NAME=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v3
        if: ${{ github.event.inputs.release == 'true' }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            output/*.jar
